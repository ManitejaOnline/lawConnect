# Render Blueprint — no secrets. JWT/OTP secrets are generated by Render.
# Postgres + Key Value stay private; only the web service is public HTTPS.

databases:
  - name: lawconnect-db
    databaseName: lawconnect
    user: lawconnect

services:
  - type: keyvalue
    name: lawconnect-redis
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: lawconnect-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__ApplyMigrations
        value: "true"
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: lawconnect-db
          property: connectionString
      - key: ConnectionStrings__HangfireConnection
        fromDatabase:
          name: lawconnect-db
          property: connectionString
      - key: ConnectionStrings__Redis
        fromService:
          name: lawconnect-redis
          type: keyvalue
          property: connectionString
      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__Issuer
        value: LawConnect
      - key: Jwt__Audience
        value: LawConnect
      - key: Otp__HashSecret
        generateValue: true
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Firebase__Enabled
        value: "false"
      - key: Payments__Provider
        value: Fake
      - key: AwsS3__Enabled
        value: "false"
